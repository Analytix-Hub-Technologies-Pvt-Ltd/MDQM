# --- Static SPA ---
location = /mdqm {
    return 301 /mdqm/;
}

location /mdqm/ {
    alias /app/mdqm/MDQM/frontend/dist/;
    index index.html;
    # With alias, fallback must stay under /mdqm/ (not /index.html)
    try_files $uri $uri/ /mdqm/index.html;
}
